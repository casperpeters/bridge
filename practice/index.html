<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oefenhanden - Bridgetafel</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../styles/practice.css">
  </head>
  <body class="practice-page-body">
    <main class="practice-page-shell">
      <header class="practice-page-topbar">
        <a class="practice-brand" href="../index.html">
          <img class="practice-logo" src="../assets/logo.png" alt="">
          <span>
            <span class="practice-eyebrow">Bridgetafel</span>
            <strong>Oefenhanden</strong>
          </span>
        </a>
        <nav class="practice-page-actions" aria-label="Navigatie">
          <a class="practice-table-link" href="../index.html">Naar tafel</a>
        </nav>
      </header>

      <section class="practice-page-head" aria-labelledby="practice-title">
        <h1 id="practice-title">Zoek een vaste oefensituatie</h1>
        <p>Filter op onderwerp, catalogus of niveau en gebruik de zichtbare id bij feedback of testen.</p>
      </section>

      <section class="practice-browser" aria-label="Oefenhanden zoeken">
        <form class="practice-filters">
          <div class="practice-filter-grid">
            <label class="practice-filter-field practice-search-field">
              <span>Zoeken</span>
              <input data-practice-search type="search" placeholder="Bijvoorbeeld troef trekken, Stayman of kwetsbaar">
            </label>
            <label class="practice-filter-field">
              <span>Catalogus</span>
              <select data-practice-catalog></select>
            </label>
            <label class="practice-filter-field">
              <span>Type</span>
              <select data-practice-focus></select>
            </label>
            <label class="practice-filter-field">
              <span>Niveau</span>
              <select data-practice-level></select>
            </label>
          </div>
          <div class="practice-lesson-overview" data-practice-lessons hidden></div>
          <p class="practice-result-count" data-practice-count aria-live="polite"></p>
        </form>

        <p class="practice-empty" data-practice-empty hidden>Geen oefenhanden gevonden.</p>
        <div class="practice-list" data-practice-list></div>
      </section>
    </main>

    <script src="../rules/bidding/systems/five-card-high/index.js"></script>
    <script src="../rules/bidding/index.js"></script>
    <script src="../rules/deterministic-playout.js"></script>
