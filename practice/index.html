  <body class="practice-page-body">
    <main class="practice-page-shell">
      <header class="practice-page-topbar">
        <a class="practice-brand" href="../index.html">
          <img class="practice-logo" src="../assets/logo.png" alt="">
          <span>
            <span class="practice-eyebrow">Bridgetafel</span>
            <strong>Oefenhanden</strong>
          </span>
        </a>
        <nav class="practice-page-actions" aria-label="Navigatie">
          <a class="practice-table-link" href="../index.html">Naar tafel</a>
        </nav>
      </header>

      <section class="practice-page-head" aria-labelledby="practice-title">
        <h1 id="practice-title">Start met Bridge 1 oefenen</h1>
        <p>Kies een les en bekijk per leerdoel of er al een tafeloefening klaarstaat.</p>
      </section>

      <section class="practice-browser" aria-label="Start met Bridge 1 oefenroute">
        <section class="practice-route-panel" data-practice-route>
          <p class="practice-result-count" data-practice-count aria-live="polite"></p>
          <div class="practice-list practice-lesson-grid" data-practice-lessons></div>
        </section>

        <section class="practice-detail" data-practice-detail hidden aria-labelledby="practice-detail-title">
          <div class="practice-detail-header">
            <button class="practice-back-button" type="button" data-practice-back>Alle lessen</button>
            <div>
              <p class="practice-detail-kicker" data-practice-detail-kicker></p>
              <h2 id="practice-detail-title" data-practice-detail-title></h2>
            </div>
          </div>
          <ol class="practice-goal-list" data-practice-goals></ol>
        </section>
      </section>
